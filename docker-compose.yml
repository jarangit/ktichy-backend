version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: kitchy_mysql
    restart: always
    environment:
      TZ: Asia/Bangkok
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: kitchy_db
      MYSQL_USER: kitchy_user
      MYSQL_PASSWORD: password
    command: --default-time-zone=+07:00
    ports:
      - "3366:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - TZ=Asia/Bangkok
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=kitchy_user
      - DB_PASS=password
      - DB_NAME=kitchy_db
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: